name: Build Windows and macOS releases

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v2.3.7'
        required: true
        default: 'v2.3.7'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Verify tag and version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref }}
      - name: Verify tag matches config.py
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.version || github.ref_name }}"
          version="$(python3 -c 'from config import APP_VERSION; print(APP_VERSION)')"
          echo "tag=$tag version=$version"
          test "v$version" = "$tag"

  windows:
    name: Windows x64
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "爱问云集成工具" `
            --icon app.ico `
            --add-data "app.ico;." `
            --add-data "assets;assets" `
            --paths . `
            --exclude-module numpy --exclude-module lxml `
            --exclude-module pandas --exclude-module scipy --exclude-module matplotlib `
            --hidden-import gui --hidden-import pipeline --hidden-import token_source `
            --hidden-import token_model --hidden-import token_windows `
            --hidden-import net --hidden-import analyze `
            --hidden-import matrix --hidden-import excel --hidden-import config `
            --hidden-import login --hidden-import banshu_export `
            --hidden-import feedback_export `
            --hidden-import homework_export `
            --hidden-import update_checker --hidden-import update_installer `
            --hidden-import theme_art `
            --hidden-import PIL `
            --hidden-import PIL.ImageDraw `
            --hidden-import PIL.ImageTk `
            --hidden-import PIL._tkinter_finder `
            --hidden-import certifi --collect-data certifi `
            run_gui.py
          Copy-Item "dist\爱问云集成工具.exe" "dist\aiwenyun-tools-windows-x64.exe"
          Get-FileHash "dist\aiwenyun-tools-windows-x64.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  aiwenyun-tools-windows-x64.exe" } |
            Set-Content "dist\aiwenyun-tools-windows-x64.sha256" -Encoding ascii
      - name: Smoke test exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\aiwenyun-tools-windows-x64.exe" `
            -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke test failed: $($p.ExitCode)" }
          $s = Start-Process -FilePath "dist\aiwenyun-tools-windows-x64.exe" `
            -ArgumentList "--ssl-test" -Wait -PassThru
          if ($s.ExitCode -ne 0) { throw "ssl test failed: $($s.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/aiwenyun-tools-windows-x64.exe
            dist/aiwenyun-tools-windows-x64.sha256

  macos:
    name: macOS ${{ matrix.arch }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Build .app
        run: |
          chmod +x build_macos.command
          ./build_macos.command
      - name: Smoke test .app
        run: |
          APP="dist/爱问云集成工具.app"
          BIN="$(find "$APP/Contents/MacOS" -type f -perm -111 | head -n1)"
          echo "binary: $BIN"
          "$BIN" --smoke-test
          "$BIN" --ssl-test
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/aiwenyun-tools-macos-*.zip
            dist/aiwenyun-tools-macos-*.sha256

  release:
    name: Publish release
    needs: [preflight, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add macOS docs
        run: |
          cp docs/诊断.command dist/macOS-DIAGNOSE.command
      - name: List assets
        run: ls -la dist
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$TAG"
          echo "tag=$tag repo=$REPO"
          release_id="$(gh api "repos/$REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\") | .id" | head -n1 || true)"
          if [ -z "$release_id" ]; then
            echo "creating draft release $tag"
            gh release create "$tag" --draft \
              --title "爱问云集成工具 $tag" \
              --notes "Windows 一键更新、macOS 构建脚本修复。"
            release_id="$(gh api "repos/$REPO/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$tag\") | .id" | head -n1)"
          fi
          if [ -z "$release_id" ]; then
            echo "release id not found for $tag"
            exit 1
          fi
          for file in dist/*; do
            [ -f "$file" ] || continue
            name="$(basename "$file")"
            uploaded=0
            for attempt in 1 2 3 4 5; do
              if gh release upload "$tag" "$file" --clobber; then
                uploaded=1
                break
              fi
              echo "upload $name failed (attempt $attempt)"
              sleep $((attempt * 5))
            done
            if [ "$uploaded" -ne 1 ]; then
              echo "upload failed: $name"
              exit 1
            fi
          done
          gh release edit "$tag" --draft=false \
            --title "爱问云集成工具 $tag" \
            --notes "Windows 一键更新、macOS 构建脚本修复。"
