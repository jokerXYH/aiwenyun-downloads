name: Verify macOS packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        default: 'v2.1.2'

jobs:
  verify:
    name: Verify ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: aiwenyun-invite-macos-arm64.zip
          - os: macos-15-intel
            asset: aiwenyun-invite-macos-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download release asset
        run: |
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 \
            -o "${{ matrix.asset }}" \
            "https://github.com/jokerXYH/aiwenyun-downloads/releases/download/${{ github.event.inputs.tag }}/${{ matrix.asset }}"
      - name: Extract and verify
        run: |
          mkdir -p out
          ditto -x -k "${{ matrix.asset }}" out
          APP="out/爱问云邀请码导出.app"
          test -d "$APP"
          echo "--- version ---"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"
          echo "--- symlinks ---"
          find "$APP" -type l | head -n 10
          echo "--- codesign ---"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "--- spctl (expected reject: not notarized) ---"
          spctl -a -vv "$APP" || true
          echo "--- smoke ---"
          "$APP/Contents/MacOS/爱问云邀请码导出" --smoke-test
          echo "--- ssl ---"
          "$APP/Contents/MacOS/爱问云邀请码导出" --ssl-test
          echo "--- docs ---"
          ls -l out/使用说明.txt out/运行日志.txt out/诊断.command
          head -n 3 out/使用说明.txt
